name: Validate dotfiles

on:
  push:
    branches:
      - main
      - dev
      - matugen
      - matugenExtended
  pull_request:

jobs:
  shell:
    name: Check shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
