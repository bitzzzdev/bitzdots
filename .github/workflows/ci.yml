name: CI Validation

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  validate:
    name: Validate Scripts and Configurations
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: |
          for s in install.sh scripts/*.sh waybar/scripts/*.sh swaync/*.sh; do
            if [ -f "$s" ]; then
              bash -n "$s" || exit 1
            fi
          done

      - name: Validate Python script syntax
        run: |
          for py in scripts/*.py waybar/modules/runcat-text/*.py; do
            if [ -f "$py" ]; then
              python3 -m py_compile "$py" || exit 1
            fi
          done

      - name: Check file formatting
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f LICENSE
